name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE: ykadi/datascientestapi

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.17 black==26.5.1 mypy==2.1.0

      - name: Run Ruff
        run: ruff check .
      
      - name: Check formatting with Black
        run: black --check .
      
      - name: Run MyPy
        run: mypy . --ignore-missing-imports

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
      
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
      
      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-image-results.sarif'

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
      
      - name: Install Helm
        uses: azure/setup-helm@v3
      
      - name: Deploy to EKS
        run: |
          # Update kubeconfig
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region eu-west-3
          # Deploy with Helm
          helm upgrade --install myapp-release-dev myapp1/ \
            --values myapp1/values.yaml \
            -f myapp1/values-dev.yaml \
            -n dev --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set database.password='${{ secrets.DB_PASSWORD }}' \
            --set pgadmin.password='${{ secrets.PGADMIN_PASSWORD }}'

      - name: Smoke test (blocking)
        run: |
          kubectl -n dev rollout status deployment/fastapi-dev --timeout=180s
          kubectl -n dev run smoke-test --rm -i --restart=Never --image=curlimages/curl -- \
            curl -fsS http://fastapi-dev:5000/health
          kubectl -n dev run acceptance-test --rm -i --restart=Never --image=curlimages/curl -- \
            sh -c 'ts=$(date +%s); curl -fsS -X POST -H "Content-Type: application/json" \
              -d "{\"name\": \"toto\", \"email\": \"toto-$ts@email.com\", \"password\": \"passwordtoto\"}" \
              http://fastapi-dev:5000/users/ \
            && curl -fsS http://fastapi-dev:5000/users/ | grep -qF "toto-$ts@email.com"'

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3
      
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
      
      - name: Install Helm
        uses: azure/setup-helm@v3
      
      - name: Deploy to EKS
        run: |
          # Update kubeconfig
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region eu-west-3
          # Deploy with Helm
          helm upgrade --install myapp-release-prod myapp1/ \
            --values myapp1/values.yaml \
            -f myapp1/values-prod.yaml \
            -n prod --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set database.password='${{ secrets.DB_PASSWORD }}' \
            --set pgadmin.password='${{ secrets.PGADMIN_PASSWORD }}'

      - name: Smoke test (blocking)
        run: |
          kubectl -n prod rollout status deployment/fastapi-prod --timeout=180s
          kubectl -n prod run smoke-test --rm -i --restart=Never --image=curlimages/curl -- \
            curl -fsS http://fastapi-prod:5000/health

