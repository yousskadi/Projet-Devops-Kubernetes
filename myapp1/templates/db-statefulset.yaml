apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  serviceName: db
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      # ⚠️ SECURITY: Security context for PostgreSQL
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: postgres
          image: postgres:15-alpine  # ⚠️ Updated to PostgreSQL 15
          imagePullPolicy: "IfNotPresent"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.fastapiName }}-config
                  key: DB_NAME
            # ⚠️ SECURITY: Remove POSTGRES_HOST_AUTH_METHOD=trust
            # Authentication is now required (default behavior)
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-fastapi-userpass
                  key: password
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.fastapiName }}-config
                  key: DB_USER
            # ⚠️ PERFORMANCE: PostgreSQL tuning
            - name: POSTGRES_INITDB_ARGS
              value: "-E UTF8 --locale=C"
          # ⚠️ HEALTHCHECKS: Liveness and readiness probes
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          # ⚠️ RESOURCES: Resource limits and requests
          resources:
            requests:
              cpu: {{ .Values.database.resources.requests.cpu | default "200m" }}
              memory: {{ .Values.database.resources.requests.memory | default "256Mi" }}
            limits:
              cpu: {{ .Values.database.resources.limits.cpu | default "1000m" }}
              memory: {{ .Values.database.resources.limits.memory | default "512Mi" }}
          volumeMounts:
            - name: postgres-db
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-db
          persistentVolumeClaim:
            claimName: {{ .Values.pvcName }}
