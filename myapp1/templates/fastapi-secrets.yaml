apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.fastapiName }}-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  # ⚠️ SECURITY: These values should be set via Helm values or external secrets operator
  # In production, use External Secrets Operator or Sealed Secrets
  SECRET_KEY: {{ .Values.secrets.secretKey | default "change-me-in-production" }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "change-me-in-production" }}
  # Database password is in postgresql-fastapi-userpass secret

