apiVersion: v1
kind: Secret
metadata:
  name: postgresql-fastapi-userpass
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  # ⚠️ SECURITY: Password must be provided at deploy time, never committed
  # CI: helm upgrade ... --set database.password=$DB_PASSWORD
  password: {{ required "database.password is required (use --set database.password=...)" .Values.database.password | quote }}
