apiVersion: v1
kind: Secret
metadata:
  name: postgresql-pgadmin-userpass
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  # ⚠️ SECURITY: Password must be provided at deploy time, never committed
  # CI: helm upgrade ... --set pgadmin.password=$PGADMIN_PASSWORD
  password: {{ required "pgadmin.password is required (use --set pgadmin.password=...)" .Values.pgadmin.password | quote }}
